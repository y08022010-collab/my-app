<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Hub - Google Auth & Call</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col font-sans">

  <!-- Login Screen -->
  <div id="login-screen" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center p-4">
    <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700 max-w-sm w-full text-center space-y-6 shadow-2xl">
      <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold">
        <i class="fas fa-comments"></i>
      </div>
      <div>
        <h2 class="text-2xl font-bold">Welcome Back</h2>
        <p class="text-gray-400 text-sm mt-1">Chat aur Call karne ke liye Google se Sign In karein</p>
      </div>
      <button onclick="signInWithGoogle()" class="w-full bg-white text-gray-900 hover:bg-gray-100 font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-3 transition shadow-lg">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google">
        Continue with Google
      </button>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="h-screen flex flex-col hidden">
    <!-- Header -->
    <header class="bg-gray-800 p-4 flex justify-between items-center border-b border-gray-700">
      <div class="flex items-center gap-3">
        <img id="user-avatar" class="w-10 h-10 rounded-full border border-indigo-500" src="" alt="User">
        <div>
          <h1 id="user-name" class="font-bold text-sm md:text-base">User Name</h1>
          <p class="text-xs text-gray-400">Your Peer ID: <span id="my-id" class="text-indigo-400 font-mono">Connecting...</span></p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="startCall(false)" class="p-3 bg-emerald-600 hover:bg-emerald-500 rounded-full text-white transition" title="Voice Call">
          <i class="fas fa-phone"></i>
        </button>
        <button onclick="startCall(true)" class="p-3 bg-indigo-600 hover:bg-indigo-500 rounded-full text-white transition" title="Video Call">
          <i class="fas fa-video"></i>
        </button>
        <button onclick="logout()" class="p-3 bg-gray-700 hover:bg-red-600 rounded-full text-gray-300 hover:text-white transition ml-2" title="Logout">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </header>

    <!-- Connect Bar -->
    <div class="bg-gray-800/50 p-3 flex gap-2 border-b border-gray-700">
      <input type="text" id="peer-id-input" placeholder="Enter Friend's Peer ID..." class="flex-1 bg-gray-700 px-4 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <button onclick="connectToPeer()" class="bg-indigo-600 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-500">Connect Chat</button>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
      <!-- Video Call Overlay -->
      <div id="video-container" class="hidden absolute inset-0 bg-black/90 z-20 flex-col items-center justify-center p-4">
        <div class="relative w-full max-w-4xl h-full max-h-[80vh] flex items-center justify-center">
          <video id="remote-video" autoplay playsinline class="w-full h-full object-cover rounded-xl border border-gray-700"></video>
          <video id="local-video" autoplay playsinline muted class="absolute bottom-4 right-4 w-32 h-44 object-cover rounded-lg border-2 border-indigo-500 shadow-lg"></video>
        </div>
        <div class="mt-4 flex gap-4">
          <button onclick="endCall()" class="bg-red-600 hover:bg-red-500 px-6 py-2 rounded-full font-semibold">End Call</button>
        </div>
      </div>

      <!-- Chat Box -->
      <div class="flex-1 flex flex-col h-full bg-gray-900">
        <div id="messages" class="flex-1 p-4 overflow-y-auto space-y-3">
          <div class="text-center text-xs text-gray-500 my-2">Connect to start messaging.</div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-gray-800 border-t border-gray-700 flex gap-2">
          <input type="text" id="message-input" placeholder="Type a message..." class="flex-1 bg-gray-700 px-4 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" onkeypress="if(event.key==='Enter') sendMessage()">
          <button onclick="sendMessage()" class="bg-indigo-600 px-5 py-2 rounded-lg font-semibold hover:bg-indigo-500"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Config values set with your Firebase Project details (yp-pvt)
    const firebaseConfig = {
      apiKey: "AIzaSyAICHGRRB8hZXheIrGP5zIbz4NA0GxvAgQ",
      authDomain: "yp-pvt.firebaseapp.com",
      projectId: "yp-pvt",
      storageBucket: "yp-pvt.firebasestorage.app",
      messagingSenderId: "456857090064",
      appId: "1:456857090064:web:46ae551ef48bf4266ef295",
      measurementId: "G-FCW233NDD0"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    let peer = null;
    let conn = null;
    let currentCall = null;
    let localStream = null;

    // Check Login State
    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('user-avatar').src = user.photoURL || 'https://via.placeholder.com/40';
        document.getElementById('user-name').innerText = user.displayName;
        
        initPeer();
      } else {
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('app').classList.add('hidden');
      }
    });

    function signInWithGoogle() {
      auth.signInWithPopup(provider).catch(error => {
        alert("Login Failed: " + error.message);
      });
    }

    function logout() {
      auth.signOut();
      if (peer) peer.destroy();
    }

    // PeerJS Operations
    function initPeer() {
      peer = new Peer();

      peer.on('open', (id) => {
        document.getElementById('my-id').innerText = id;
      });

      peer.on('connection', (connection) => {
        conn = connection;
        setupChatListeners();
      });

      peer.on('call', async (call) => {
        const isVideo = confirm("Incoming call! Accept with Video?");
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            video: isVideo,
            audio: true
          });
          call.answer(localStream);
          currentCall = call;
          setupCallStream(call, isVideo);
        } catch (err) {
          alert("Microphone/Camera permission zaroori hai.");
        }
      });
    }

    function connectToPeer() {
      const peerId = document.getElementById('peer-id-input').value.trim();
      if (!peerId) return alert("Peer ID enter karein!");
      conn = peer.connect(peerId);
      setupChatListeners();
    }

    function setupChatListeners() {
      conn.on('open', () => {
        appendMessage('System', 'Connected successfully!', 'system');
      });
      conn.on('data', (data) => {
        appendMessage('Friend', data, 'received');
      });
    }

    function sendMessage() {
      const msgInput = document.getElementById('message-input');
      const msg = msgInput.value.trim();
      if (!msg) return;

      if (conn && conn.open) {
        conn.send(msg);
        appendMessage('You', msg, 'sent');
        msgInput.value = '';
      } else {
        alert("Pehle Friend ID se Connect karein!");
      }
    }

    function appendMessage(sender, text, type) {
      const messagesEl = document.getElementById('messages');
      const msgDiv = document.createElement('div');
      if (type === 'sent') {
        msgDiv.className = 'flex justify-end';
        msgDiv.innerHTML = `<div class="bg-indigo-600 text-white px-4 py-2 rounded-xl max-w-xs text-sm">${text}</div>`;
      } else if (type === 'received') {
        msgDiv.className = 'flex justify-start';
        msgDiv.innerHTML = `<div class="bg-gray-700 text-white px-4 py-2 rounded-xl max-w-xs text-sm">${text}</div>`;
      } else {
        msgDiv.className = 'text-center text-xs text-indigo-400 font-semibold my-1';
        msgDiv.innerText = text;
      }
      messagesEl.appendChild(msgDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function startCall(videoEnabled) {
      const peerId = document.getElementById('peer-id-input').value.trim();
      if (!peerId) return alert("Pehle Friend ID enter karein!");

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: videoEnabled,
          audio: true
        });

        const call = peer.call(peerId, localStream);
        currentCall = call;
        setupCallStream(call, videoEnabled);
      } catch (err) {
        alert("Camera/Mic access denied!");
      }
    }

    function setupCallStream(call, showVideo) {
      const videoContainer = document.getElementById('video-container');
      if (showVideo) videoContainer.classList.remove('hidden');
      videoContainer.classList.add('flex');

      document.getElementById('local-video').srcObject = localStream;

      call.on('stream', (remoteStream) => {
        document.getElementById('remote-video').srcObject = remoteStream;
      });

      call.on('close', () => {
        endCall();
      });
    }

    function endCall() {
      const videoContainer = document.getElementById('video-container');
      if (currentCall) currentCall.close();
      if (localStream) localStream.getTracks().forEach(track => track.stop());

      videoContainer.classList.add('hidden');
      videoContainer.classList.remove('flex');
      document.getElementById('remote-video').srcObject = null;
      document.getElementById('local-video').srcObject = null;
    }
  </script>
</body>
</html>
